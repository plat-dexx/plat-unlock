<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubUnlock - Plat • Dex</title>
    <style>
        :root {
            --red-main: #ff003c;
            --bg-void: #000000;
            --text-pure: #ffffff;
            --text-dim: #8e8e93;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif;
        }

        /* NỀN ĐEN THUẦN */
        body {
            background-color: #000000;
            color: var(--text-pure);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 620px;
            padding: 30px 18px;
            flex: 1;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* HEADER: KHUNG CHỮ NHẬT GIÁP ROBOT ĐA TẦNG + DẢI LED NEON 7 MÀU */
        header {
            display: flex;
            justify-content: center;
            margin-bottom: 35px;
            width: 100%;
        }

        .mech-header-outer {
            position: relative;
            width: 100%;
            max-width: 530px;
            padding: 3px;
            background: linear-gradient(90deg, #ff0000, #ff7700, #ffee00, #00ff55, #00e1ff, #0033ff, #8800ff, #ff0000);
            background-size: 200% 100%;
            animation: flowRainbow 3.5s linear infinite;
            border-radius: 2px;
            box-shadow: 
                0 0 25px rgba(255, 0, 60, 0.4),
                0 15px 35px rgba(0, 0, 0, 0.95);
        }

        .mech-header-armor {
            position: relative;
            background: linear-gradient(180deg, #181b24 0%, #0b0c10 100%);
            border: 2px solid #363c4e;
            border-top: 2px solid #5a647d;
            border-bottom: 3px solid #050608;
            padding: 26px 20px 22px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 
                inset 0 1px 0 rgba(255, 255, 255, 0.25),
                inset 0 0 15px rgba(0, 0, 0, 0.9),
                0 0 0 2px #101217;
        }

        .mech-bolt {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #3c4253;
            border: 1px solid #141720;
            border-radius: 50%;
            box-shadow: inset 1px 1px 1px rgba(255, 255, 255, 0.6), 0 1px 2px rgba(0, 0, 0, 0.8);
        }
        .bolt-tl { top: 8px; left: 8px; }
        .bolt-tr { top: 8px; right: 8px; }
        .bolt-bl { bottom: 8px; left: 8px; }
        .bolt-br { bottom: 8px; right: 8px; }

        @keyframes flowRainbow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .header-main-title {
            font-size: clamp(2rem, 7vw, 2.7rem);
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 12px;
            line-height: 1.15;
            background: linear-gradient(90deg, #ff0000, #ff7700, #ffee00, #00ff55, #00e1ff, #0033ff, #8800ff, #ff0000);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: flowRainbow 3.5s linear infinite;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 15px rgba(255, 0, 60, 0.4));
        }

        .header-sub-title {
            font-size: clamp(0.75rem, 2.8vw, 0.95rem);
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 8px;
            background: linear-gradient(90deg, #ff0000, #ff7700, #ffee00, #00ff55, #00e1ff, #0033ff, #8800ff, #ff0000);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: flowRainbow 3.5s linear infinite;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 10px rgba(255, 0, 60, 0.35));
        }

        /* KHUNG CHỨA NÚT MỞ KHÓA */
        .unlock-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
        }

        .unlock-btn {
            width: 100%;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 0 45px;
            font-size: 1.05rem;
            font-weight: 800;
            text-transform: uppercase;
            text-decoration: none;
            color: #ffffff;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
            outline: none;
            box-sizing: border-box;
        }

        .unlock-btn svg {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 22px;
            height: 22px;
            fill: currentColor;
            flex-shrink: 0;
            pointer-events: none;
        }

        .unlock-btn span {
            display: block;
            width: 100%;
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
        }

        /* TRẠNG THÁI KHÓA */
        .unlock-btn.disabled {
            background: rgba(255, 255, 255, 0.05) !important;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: rgba(255, 255, 255, 0.35) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            cursor: not-allowed !important;
            box-shadow: none !important;
            pointer-events: none;
        }

        .unlock-btn.disabled svg {
            fill: rgba(255, 255, 255, 0.35) !important;
        }

        /* TRẠNG THÁI ĐÃ HOÀN THÀNH */
        .unlock-btn.completed {
            background: linear-gradient(135deg, #00b09b, #96c93d) !important;
            color: #ffffff !important;
            border-color: #00ff88 !important;
            box-shadow: 0 0 18px rgba(0, 255, 136, 0.5) !important;
            pointer-events: none;
        }

        /* Nút YouTube */
        .btn-youtube:not(.disabled):not(.completed) {
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 20px rgba(255, 0, 0, 0.4);
        }
        .btn-youtube:not(.disabled):hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 0, 0, 0.7);
        }

        /* Nút TikTok */
        .btn-tiktok:not(.disabled):not(.completed) {
            background: linear-gradient(135deg, #ff0055 0%, #ff5252 50%, #ff7300 100%);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 20px rgba(255, 0, 85, 0.4);
        }
        .btn-tiktok:not(.disabled):hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 0, 85, 0.7);
        }

        /* Nút Tải */
        .btn-download:not(.disabled) {
            background: linear-gradient(135deg, #e91e63 0%, #ff0055 100%);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 20px rgba(233, 30, 99, 0.6);
            animation: pulseUnlock 1.8s infinite alternate;
        }
        .btn-download:not(.disabled):hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 30px rgba(233, 30, 99, 0.9);
        }

        @keyframes pulseUnlock {
            0% { box-shadow: 0 0 10px rgba(233, 30, 99, 0.4); }
            100% { box-shadow: 0 0 25px rgba(233, 30, 99, 0.9); }
        }

        footer {
            width: 100%;
            border-top: 1px solid #141418;
            padding: 30px 15px;
            margin-top: 50px;
            text-align: center;
            background: #000000;
        }

        .footer-info {
            max-width: 620px;
            margin: 0 auto;
        }

        .footer-info h3 {
            color: var(--red-main);
            font-size: 0.85rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .footer-info p {
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <header>
            <div class="mech-header-outer">
                <div class="mech-header-armor">
                    <span class="mech-bolt bolt-tl"></span>
                    <span class="mech-bolt bolt-tr"></span>
                    <span class="mech-bolt bolt-bl"></span>
                    <span class="mech-bolt bolt-br"></span>

                    <h1 class="header-main-title">PLAT • DEX</h1>
                    <p class="header-sub-title">Nơi Các Siêu Nhân Ra Đời</p>
                </div>
            </div>
        </header>

        <!-- DANH SÁCH 4 NÚT THEO THỨ TỰ YÊU CẦU -->
        <main class="unlock-container">
            <!-- Nút 1: Đăng Kí Youtube -->
            <button id="btn-step1" class="unlock-btn btn-youtube" onclick="processStep(1, 'https://youtube.com/@plat_dex')">
                <svg viewBox="0 0 24 24">
                    <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                </svg>
                <span id="txt-step1">Đăng Kí Youtube</span>
            </button>

            <!-- Nút 2: Follow TikTok 1 -->
            <button id="btn-step2" class="unlock-btn btn-tiktok disabled" onclick="processStep(2, 'https://www.tiktok.com/@plat_dex')">
                <svg viewBox="0 0 24 24">
                    <path d="M12.525 0h3.08c.089 1.488.75 2.83 1.8 3.82 1.05 1 2.45 1.57 3.965 1.62V8.58c-1.85 0-3.56-.56-4.985-1.52v7.1c0 4.14-3.36 7.5-7.5 7.5S1.39 18.3 1.39 14.16c0-4.14 3.36-7.5 7.5-7.5.38 0 .75.03 1.11.09V9.93c-.36-.08-.73-.12-1.11-.12-2.39 0-4.34 1.95-4.34 4.35 0 2.4 1.95 4.35 4.34 4.35 2.39 0 4.35-1.95 4.35-4.35V0z"/>
                </svg>
                <span id="txt-step2">Follow TikTok</span>
            </button>

            <!-- Nút 3: Follow TikTok 2 -->
            <button id="btn-step3" class="unlock-btn btn-tiktok disabled" onclick="processStep(3, 'https://www.tiktok.com/@duy_lee01')">
                <svg viewBox="0 0 24 24">
                    <path d="M12.525 0h3.08c.089 1.488.75 2.83 1.8 3.82 1.05 1 2.45 1.57 3.965 1.62V8.58c-1.85 0-3.56-.56-4.985-1.52v7.1c0 4.14-3.36 7.5-7.5 7.5S1.39 18.3 1.39 14.16c0-4.14 3.36-7.5 7.5-7.5.38 0 .75.03 1.11.09V9.93c-.36-.08-.73-.12-1.11-.12-2.39 0-4.34 1.95-4.34 4.35 0 2.4 1.95 4.35 4.34 4.35 2.39 0 4.35-1.95 4.35-4.35V0z"/>
                </svg>
                <span id="txt-step3">Follow TikTok</span>
            </button>

            <!-- Nút 4: Mở Khóa Để Tải -->
            <button id="btn-step4" class="unlock-btn btn-download disabled" onclick="downloadFile()">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14v-4H8l4-4 4 4h-3v4h-2z"/>
                </svg>
                <span id="txt-step4">Mở Khoá Để Tải</span>
            </button>
        </main>
    </div>

    <!-- FOOTER -->
    <footer>
        <div class="footer-info">
            <h3>THÔNG TIN CHỦ SỞ HỮU</h3>
            <p><strong>Developer:</strong> Plat • Dex</p>
            <p><strong>Địa Chỉ:</strong> Hà Nội, Việt Nam</p>
        </div>
    </footer>

    <!-- SCRIPT SUBUNLOCK 3 BƯỚC -->
    <script>
        let step1Completed = false;
        let step2Completed = false;
        let step3Completed = false;

        function processStep(stepNum, url) {
            // Bước 1: YouTube
            if (stepNum === 1 && !step1Completed) {
                window.open(url, '_blank');
                let count = 5;
                const txt = document.getElementById('txt-step1');
                txt.innerText = `Đang xác minh... (${count}s)`;

                const timer = setInterval(() => {
                    count--;
                    if (count > 0) {
                        txt.innerText = `Đang xác minh... (${count}s)`;
                    } else {
                        clearInterval(timer);
                        step1Completed = true;
                        txt.innerText = '✓ Đã Hoàn Thành';
                        
                        const btn1 = document.getElementById('btn-step1');
                        btn1.classList.add('completed');

                        // Mở khóa Nút TikTok 1
                        const btn2 = document.getElementById('btn-step2');
                        btn2.classList.remove('disabled');
                    }
                }, 1000);
            } 
            // Bước 2: TikTok 1
            else if (stepNum === 2 && step1Completed && !step2Completed) {
                window.open(url, '_blank');
                let count = 5;
                const txt = document.getElementById('txt-step2');
                txt.innerText = `Đang xác minh... (${count}s)`;

                const timer = setInterval(() => {
                    count--;
                    if (count > 0) {
                        txt.innerText = `Đang xác minh... (${count}s)`;
                    } else {
                        clearInterval(timer);
                        step2Completed = true;
                        txt.innerText = '✓ Đã Hoàn Thành';

                        const btn2 = document.getElementById('btn-step2');
                        btn2.classList.add('completed');

                        // Mở khóa Nút TikTok 2
                        const btn3 = document.getElementById('btn-step3');
                        btn3.classList.remove('disabled');
                    }
                }, 1000);
            }
            // Bước 3: TikTok 2
            else if (stepNum === 3 && step2Completed && !step3Completed) {
                window.open(url, '_blank');
                let count = 5;
                const txt = document.getElementById('txt-step3');
                txt.innerText = `Đang xác minh... (${count}s)`;

                const timer = setInterval(() => {
                    count--;
                    if (count > 0) {
                        txt.innerText = `Đang xác minh... (${count}s)`;
                    } else {
                        clearInterval(timer);
                        step3Completed = true;
                        txt.innerText = '✓ Đã Hoàn Thành';

                        const btn3 = document.getElementById('btn-step3');
                        btn3.classList.add('completed');

                        // Mở khóa Nút Tải
                        const btn4 = document.getElementById('btn-step4');
                        btn4.classList.remove('disabled');
                    }
                }, 1000);
            }
        }

        function downloadFile() {
            if (step1Completed && step2Completed && step3Completed) {
                window.location.href = "https://sitetop.net/subunlock-menu";
            }
        }
    </script>
</body>
</html>
