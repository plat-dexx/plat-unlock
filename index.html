<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubUnlock - Plat • Dex</title>
    <style>
        :root {
            --border-cyan: #00f0ff;
            --text-main: #ffffff;
        }

        /* Đồng bộ phông chữ Times New Roman */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Times New Roman', Times, serif !important;
        }

        body {
            background-color: #000000;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* CANVAS MATRIX CODE BACKGROUND */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            opacity: 0.45;
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 30px 15px;
            flex: 1;
            position: relative;
            z-index: 1;
        }

        /* HEADER & KHUNG LIQUID GLASS MỜ DÀNH CHO PLAT • DEX */
        header {
            text-align: center;
            margin-bottom: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* KHUNG LIQUID GLASS */
        .glass-box {
            position: relative;
            padding: 20px 30px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 
                0 8px 32px 0 rgba(0, 240, 255, 0.25),
                inset 0 0 15px rgba(255, 255, 255, 0.1);
            display: inline-block;
            margin-bottom: 12px;
            overflow: hidden;
            transition: all 0.4s ease;
        }

        .glass-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0,240,255,0.3) 0%, rgba(255,0,85,0.3) 50%, transparent 70%);
            animation: liquidRotate 6s linear infinite;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes liquidRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* TIÊU ĐỀ PLAT • DEX */
        .rainbow-3d-title {
            font-size: 2.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            line-height: 1.1;
            
            background: linear-gradient(
                90deg, 
                #ff0055, #ff7300, #fffb00, #48ff00, #00ffd5, #002bfd, #7a00ff, #ff00c8, #ff0055
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            filter: drop-shadow(2px 2px 0px #000) 
                    drop-shadow(-1px -1px 0px #000)
                    drop-shadow(0px 0px 15px rgba(0, 240, 255, 0.8));

            animation: rainbowFlow 3s linear infinite, glowPulse 1.5s ease-in-out infinite alternate;
        }

        @keyframes rainbowFlow {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        @keyframes glowPulse {
            0% {
                filter: drop-shadow(2px 2px 0px #000) 
                        drop-shadow(0px 0px 10px rgba(255, 0, 128, 0.8));
            }
            100% {
                filter: drop-shadow(3px 3px 0px #000) 
                        drop-shadow(0px 0px 25px rgba(0, 240, 255, 1));
            }
        }

        header p {
            font-size: 1.2rem;
            color: #00f0ff;
            text-transform: uppercase;
            font-weight: bold;
            margin-top: 5px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
        }

        /* SUBUNLOCK BOX */
        .unlock-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            margin-top: 10px;
        }

        .unlock-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: none;
            color: #ffffff;
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            cursor: pointer;
        }

        /* Nút TikTok */
        .btn-tiktok {
            background: linear-gradient(135deg, #000000 0%, #ee1d52 50%, #69c9d0 100%);
            border: 1px solid #ee1d52;
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
        }

        .btn-tiktok:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 25px rgba(238, 29, 82, 0.8);
        }

        /* Nút Telegram */
        .btn-telegram {
            background: linear-gradient(135deg, #0088cc 0%, #00f0ff 100%);
            border: 1px solid #00f0ff;
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
        }

        .btn-telegram:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
        }

        /* Nút Mở Khoá Để Tải (Mới thêm) */
        .btn-download-unlock {
            background: linear-gradient(135deg, #ff7300 0%, #fffb00 100%);
            color: #000000;
            border: 1px solid #fffb00;
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
            box-shadow: 0 0 15px rgba(255, 251, 0, 0.5);
            margin-top: 5px;
        }

        .btn-download-unlock:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 30px rgba(255, 251, 0, 0.9);
            background: linear-gradient(135deg, #fffb00 0%, #ff7300 100%);
        }

        .unlock-btn svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        /* FOOTER */
        footer {
            width: 100%;
            background: transparent;
            border-top: 2px solid var(--border-cyan);
            padding: 35px 20px;
            margin-top: 50px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .footer-info {
            max-width: 650px;
            margin: 0 auto;
        }

        .footer-info h3 {
            color: var(--border-cyan);
            margin-bottom: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .footer-info p {
            margin-bottom: 8px;
            color: #ffffff;
            font-size: 1.1rem;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.9);
        }

        .map-container {
            margin-top: 20px;
            width: 100%;
            overflow: hidden;
            border: 1px solid var(--border-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
        }

        .map-container iframe {
            width: 100%;
            height: 220px;
            border: 0;
            filter: invert(90%) hue-rotate(180deg) contrast(1.2);
        }

        /* NÚT TELEGRAM TRÒN FLOATING */
        .telegram-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #00f0ff, #0044ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            transition: transform 0.3s, box-shadow 0.3s;
            z-index: 1000;
            border: 2px solid #ffffff;
        }

        .telegram-btn:hover {
            transform: scale(1.15) rotate(10deg);
            box-shadow: 0 0 30px rgba(0, 240, 255, 1);
        }

        .telegram-btn svg {
            width: 30px;
            height: 30px;
            fill: #ffffff;
            margin-right: 2px;
        }
    </style>
</head>
<body>

    <!-- Canvas Matrix phủ toàn bộ màn hình -->
    <canvas id="matrix-canvas"></canvas>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="glass-box">
                <h1 class="rainbow-3d-title">Plat • Dex</h1>
            </div>
            <p>Mở Khoá Để Tải</p>
        </header>

        <!-- Subunlock Buttons -->
        <main class="unlock-container">
            
            <!-- Nút TikTok -->
            <a href="https://www.tiktok.com/@duy_lee01" target="_blank" class="unlock-btn btn-tiktok">
                <svg viewBox="0 0 24 24">
                    <path d="M12.525 0h3.08c.089 1.488.75 2.83 1.8 3.82 1.05 1 2.45 1.57 3.965 1.62V8.58c-1.85 0-3.56-.56-4.985-1.52v7.1c0 4.14-3.36 7.5-7.5 7.5S1.39 18.3 1.39 14.16c0-4.14 3.36-7.5 7.5-7.5.38 0 .75.03 1.11.09V9.93c-.36-.08-.73-.12-1.11-.12-2.39 0-4.34 1.95-4.34 4.35 0 2.4 1.95 4.35 4.34 4.35 2.39 0 4.35-1.95 4.35-4.35V0z"/>

            </a>

            <!-- Nút Telegram -->
            <a href="https://t.me/plat_shareios" target="_blank" class="unlock-btn btn-telegram">

        </main>
    </div>

    <!-- Footer: Thông Tin Chủ Sở Hữu -->
    <footer>
        <div class="footer-info">
            <h3>THÔNG TIN CHỦ SỞ HỮU</h3>
            <p><strong>Developer:</strong> Plat • Dex</p>
            <p><strong>Địa Chỉ:</strong> Hà Nội , Việt Nam</p>
            
            <div class="map-container">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d476859.1023737525!2d105.37248386807498!3d20.97344611400609!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3135ab9bd9861ca1%3A0x3233d6118b3cb358!2zSMOgIE7hu5lpLCBWaeG7h3QgTmFt!5e0!3m2!1svi!2s!4v1700000000000!5m2!1svi!2s" 
                    allowfullscreen="" 
                    loading="lazy">
                </iframe>
            </div>
        </div>
    </footer>

    <!-- Icon Telegram Float -->
    <a href="https://t.me/plat_shareios" class="telegram-btn" target="_blank" aria-label="Telegram">
        <svg viewBox="0 0 24 24">
            <path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.56 8.16l-2.01 9.48c-.15.68-.55.84-1.12.52l-3.1-2.28-1.5 1.44c-.17.17-.31.31-.63.31l.22-3.17 5.77-5.21c.25-.22-.05-.34-.39-.12l-7.13 4.49-3.07-.96c-.67-.21-.68-.67.14-.99l12.01-4.63c.56-.21 1.05.13.83.92z"/>
        </svg>

    <!-- SCRIPT CHỮ NỀN MATRIX ĐA HƯỚNG LỘN XỘN -->
    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ<>/{}[];:*&^%$#@!PLATDEX';
        const fontSize = 14;
        const totalStreams = 70;
        const streams = [];

        for (let i = 0; i < totalStreams; i++) {
            resetStream(i);
        }

        function resetStream(i) {
            const dir = Math.floor(Math.random() * 3);
            let x, y;

            if (dir === 0) {
                x = Math.random() * canvas.width;
                y = Math.random() * -200;
            } else if (dir === 1) {
                x = Math.random() * -200;
                y = Math.random() * canvas.height;
            } else {
                x = canvas.width + Math.random() * 200;
                y = Math.random() * canvas.height;
            }

            streams[i] = {
                dir: dir,
                x: x,
                y: y,
                speed: 2 + Math.random() * 4,
                length: 8 + Math.floor(Math.random() * 15),
                chars: Array.from({length: 20}, () => chars.charAt(Math.floor(Math.random() * chars.length)))
            };
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + 'px monospace';

            streams.forEach((s, idx) => {
                for (let j = 0; j < s.length; j++) {
                    let charX = s.x;
                    let charY = s.y;

                    if (s.dir === 0) charY -= j * fontSize;
                    else if (s.dir === 1) charX -= j * fontSize;
                    else if (s.dir === 2) charX += j * fontSize;

                    if (j === 0) {
                        ctx.fillStyle = '#ffffff';
                    } else {
                        ctx.fillStyle = `rgba(0, 240, 255, ${1 - j / s.length})`;
                    }

                    if (Math.random() < 0.05) {
                        s.chars[j] = chars.charAt(Math.floor(Math.random() * chars.length));
                    }

                    ctx.fillText(s.chars[j], charX, charY);
                }

                if (s.dir === 0) s.y += s.speed;
                else if (s.dir === 1) s.x += s.speed;
                else if (s.dir === 2) s.x -= s.speed;

                if (
                    (s.dir === 0 && s.y - s.length * fontSize > canvas.height) ||
                    (s.dir === 1 && s.x - s.length * fontSize > canvas.width) ||
                    (s.dir === 2 && s.x + s.length * fontSize < 0)
                ) {
                    resetStream(idx);
                }
            });
        }

        setInterval(drawMatrix, 33);
    </script>
</body>
</html>
