<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubUnlock - Plat • Dex</title>
    <style>
        :root {
            --red-main: #ff003c;
            --bg-void: #000000;
            --text-pure: #ffffff;
            --text-dim: #8e8e93;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif;
        }

        /* NỀN ĐEN THUẦN */
        body {
            background-color: #000000;
            color: var(--text-pure);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 620px;
            padding: 30px 18px;
            flex: 1;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* HEADER: KHUNG CHỮ NHẬT GIÁP ROBOT ĐA TẦNG + DẢI LED NEON 7 MÀU */
        header {
            display: flex;
            justify-content: center;
            margin-bottom: 35px;
            width: 100%;
        }

        .mech-header-outer {
            position: relative;
            width: 100%;
            max-width: 530px;
            padding: 3px;
            /* Dải LED 7 màu chạy từ trái sang phải */
            background: linear-gradient(90deg, #ff0000, #ff7700, #ffee00, #00ff55, #00e1ff, #0033ff, #8800ff, #ff0000);
            background-size: 200% 100%;
            animation: flowRainbow 3.5s linear infinite;
            border-radius: 2px;
            box-shadow: 
                0 0 25px rgba(255, 0, 60, 0.4),
                0 15px 35px rgba(0, 0, 0, 0.95);
        }

        /* Lớp giáp nổi đa tầng bên trong */
        .mech-header-armor {
            position: relative;
            background: linear-gradient(180deg, #181b24 0%, #0b0c10 100%);
            border: 2px solid #363c4e;
            border-top: 2px solid #5a647d;
            border-bottom: 3px solid #050608;
            padding: 26px 20px 22px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 
                inset 0 1px 0 rgba(255, 255, 255, 0.25),
                inset 0 0 15px rgba(0, 0, 0, 0.9),
                0 0 0 2px #101217;
        }

        /* Đinh tán cơ khí 4 góc */
        .mech-bolt {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #3c4253;
            border: 1px solid #141720;
            border-radius: 50%;
            box-shadow: inset 1px 1px 1px rgba(255, 255, 255, 0.6), 0 1px 2px rgba(0, 0, 0, 0.8);
        }
        .bolt-tl { top: 8px; left: 8px; }
        .bolt-tr { top: 8px; right: 8px; }
        .bolt-bl { bottom: 8px; left: 8px; }
        .bolt-br { bottom: 8px; right: 8px; }

        @keyframes flowRainbow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        /* LOGO TAY CẦM CHƠI GAME */
        .logo-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-svg {
            width: clamp(140px, 26vw, 175px);
            height: clamp(140px, 26vw, 175px);
            filter: drop-shadow(0 0 18px rgba(0, 136, 255, 0.8)) drop-shadow(0 0 8px rgba(255, 170, 0, 0.7));
            transition: transform 0.3s ease;
        }

        .logo-wrapper:hover .logo-svg {
            transform: scale(1.05);
        }

        /* CHỮ 7 MÀU CHẠY TỪ TRÁI SANG PHẢI */
        .header-main-title {
            font-size: clamp(2rem, 7vw, 2.7rem);
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 10px;
            line-height: 1.15;
            background: linear-gradient(90deg, #ff0000, #ff7700, #ffee00, #00ff55, #00e1ff, #0033ff, #8800ff, #ff0000);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: flowRainbow 3.5s linear infinite;
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.35)) drop-shadow(2px 4px 8px rgba(0, 0, 0, 0.95));
        }

        .header-sub-title {
            font-size: clamp(0.75rem, 2.8vw, 0.95rem);
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 8px;
            background: linear-gradient(90deg, #ff0000, #ff7700, #ffee00, #00ff55, #00e1ff, #0033ff, #8800ff, #ff0000);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: flowRainbow 3.5s linear infinite;
            filter: drop-shadow(0 0 10px rgba(255, 0, 60, 0.6)) drop-shadow(1px 2px 4px rgba(0, 0, 0, 0.9));
        }

        /* KHUNG BỐ CỤC NÚT UNLOCK (GIỮ NGUYÊN CẤU TRÚC & MÀU SẮC) */
        .unlock-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
        }

        .unlock-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 20px;
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            text-decoration: none;
            color: #ffffff;
            border-radius: 12px;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
        }

        .unlock-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            flex-shrink: 0;
        }

        /* TRẠNG THÁI KHÓA */
        .unlock-btn.disabled {
            background: rgba(255, 255, 255, 0.05) !important;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: rgba(255, 255, 255, 0.35) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            cursor: not-allowed !important;
            box-shadow: none !important;
        }

        .unlock-btn.disabled svg {
            fill: rgba(255, 255, 255, 0.35) !important;
        }

        /* TRẠNG THÁI ĐÃ HOÀN THÀNH */
        .unlock-btn.completed {
            background: linear-gradient(135deg, #00b09b, #96c93d) !important;
            color: #ffffff !important;
            border-color: #00ff88 !important;
            box-shadow: 0 0 18px rgba(0, 255, 136, 0.5) !important;
        }

        /* Nút TikTok - Active */
        .btn-tiktok:not(.disabled):not(.completed) {
            background: linear-gradient(135deg, #ff0055 0%, #ff5252 50%, #ff7300 100%);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 20px rgba(255, 0, 85, 0.4);
        }
        .btn-tiktok:not(.disabled):hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 0, 85, 0.7);
        }

        /* Nút YouTube - Active */
        .btn-youtube:not(.disabled):not(.completed) {
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 20px rgba(255, 0, 0, 0.4);
        }
        .btn-youtube:not(.disabled):hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 0, 0, 0.7);
        }

        /* Nút Mở Khóa Để Tải - Active */
        .btn-download:not(.disabled) {
            background: linear-gradient(135deg, #e91e63 0%, #ff0055 100%);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 20px rgba(233, 30, 99, 0.6);
            animation: pulseUnlock 1.8s infinite alternate;
        }
        .btn-download:not(.disabled):hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 30px rgba(233, 30, 99, 0.9);
        }

        @keyframes pulseUnlock {
            0% { box-shadow: 0 0 10px rgba(233, 30, 99, 0.4); }
            100% { box-shadow: 0 0 25px rgba(233, 30, 99, 0.9); }
        }

        /* FOOTER */
        footer {
            width: 100%;
            border-top: 1px solid #141418;
            padding: 30px 15px;
            margin-top: 50px;
            text-align: center;
            background: #000000;
        }

        .footer-info {
            max-width: 620px;
            margin: 0 auto;
        }

        .footer-info h3 {
            color: var(--red-main);
            font-size: 0.85rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .footer-info p {
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER VỎ ROBOT CHỮ NHẬT ĐA TẦNG + DẢI LED NEON 7 MÀU -->
        <header>
            <div class="mech-header-outer">
                <div class="mech-header-armor">
                    <!-- 4 đinh tán vỏ giáp -->
                    <span class="mech-bolt bolt-tl"></span>
                    <span class="mech-bolt bolt-tr"></span>
                    <span class="mech-bolt bolt-bl"></span>
                    <span class="mech-bolt bolt-br"></span>

                    <!-- SVG LOGO TAY CẦM CHƠI GAME CYBER MECH -->
                    <div class="logo-wrapper">
                        <svg class="logo-svg" viewBox="0 0 300 240" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="padGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#191e2b"/>
                                    <stop offset="60%" stop-color="#0b0e14"/>
                                    <stop offset="100%" stop-color="#040608"/>
                                </linearGradient>
                            </defs>

                            <!-- Vỏ viền ngoài tay cầm -->
                            <path d="M75 55 C105 50, 130 65, 150 65 C170 65, 195 50, 225 55 C255 60, 280 85, 275 135 C270 180, 245 215, 215 210 C190 205, 180 170, 150 170 C120 170, 110 205, 85 210 C55 215, 30 180, 25 135 C20 85, 45 60, 75 55 Z" 
                                  fill="url(#padGrad)" stroke="#0088ff" stroke-width="3.5" stroke-linejoin="round"/>

                            <!-- Dải viền kim loại 2 bên báng cầm -->
                            <path d="M45 125 C40 160, 58 190, 80 195 C95 198, 102 180, 108 160" fill="none" stroke="#ffaa00" stroke-width="2.5" stroke-linecap="round"/>
                            <path d="M255 125 C260 160, 242 190, 220 195 C205 198, 198 180, 192 160" fill="none" stroke="#ffaa00" stroke-width="2.5" stroke-linecap="round"/>

                            <!-- Cò bấm Trigger L1/R1 -->
                            <path d="M60 52 C75 35, 105 32, 120 38" fill="none" stroke="#00e1ff" stroke-width="3.5" stroke-linecap="round"/>
                            <path d="M240 52 C225 35, 195 32, 180 38" fill="none" stroke="#00e1ff" stroke-width="3.5" stroke-linecap="round"/>

                            <!-- Touchpad / Đèn LED Trung tâm -->
                            <rect x="126" y="70" width="48" height="32" rx="6" fill="#10141d" stroke="#00d4ff" stroke-width="2"/>
                            <circle cx="150" cy="86" r="5" fill="#ff0055"/>

                            <!-- Cụm Phím D-PAD điều hướng (Trái) -->
                            <path d="M78 92 h14 v-14 h16 v14 h14 v16 h-14 v14 h-16 v-14 h-14 z" 
                                  fill="#1b212e" stroke="#00e1ff" stroke-width="2" stroke-linejoin="round"/>
                            <polygon points="93,82 89,89 97,89" fill="#00e1ff"/>
                            <polygon points="93,132 89,125 97,125" fill="#00e1ff"/>
                            <polygon points="83,107 90,103 90,111" fill="#00e1ff"/>
                            <polygon points="117,107 110,103 110,111" fill="#00e1ff"/>

                            <!-- Cụm Phím Hành Động X Y A B (Phải) -->
                            <circle cx="205" cy="82" r="8" fill="#1b212e" stroke="#ffee00" stroke-width="2"/>
                            <text x="205" y="86" font-size="9" font-weight="900" fill="#ffee00" text-anchor="middle" font-family="sans-serif">Y</text>

                            <circle cx="185" cy="100" r="8" fill="#1b212e" stroke="#00e1ff" stroke-width="2"/>
                            <text x="185" y="104" font-size="9" font-weight="900" fill="#00e1ff" text-anchor="middle" font-family="sans-serif">X</text>

                            <circle cx="225" cy="100" r="8" fill="#1b212e" stroke="#ff003c" stroke-width="2"/>
                            <text x="225" y="104" font-size="9" font-weight="900" fill="#ff003c" text-anchor="middle" font-family="sans-serif">B</text>

                            <circle cx="205" cy="118" r="8" fill="#1b212e" stroke="#00ff55" stroke-width="2"/>
                            <text x="205" y="122" font-size="9" font-weight="900" fill="#00ff55" text-anchor="middle" font-family="sans-serif">A</text>

                            <!-- Cần Joystick Analog Trái -->
                            <circle cx="118" cy="144" r="18" fill="#121620" stroke="#333b4e" stroke-width="2"/>
                            <circle cx="118" cy="144" r="13" fill="#1a202d" stroke="#0088ff" stroke-width="2"/>
                            <circle cx="118" cy="144" r="5" fill="#00e1ff"/>

                            <!-- Cần Joystick Analog Phải -->
                            <circle cx="182" cy="144" r="18" fill="#121620" stroke="#333b4e" stroke-width="2"/>
                            <circle cx="182" cy="144" r="13" fill="#1a202d" stroke="#0088ff" stroke-width="2"/>
                            <circle cx="182" cy="144" r="5" fill="#00e1ff"/>

                            <!-- Dây vi mạch trang trí công nghệ -->
                            <path d="M130 115 L140 126 L160 126 L170 115" fill="none" stroke="#ffaa00" stroke-width="1.5" stroke-linecap="round"/>
                            <circle cx="130" cy="115" r="2" fill="#ffaa00"/>
                            <circle cx="170" cy="115" r="2" fill="#ffaa00"/>
                        </svg>
                    </div>

                    <!-- CHỮ 7 MÀU NỔI BẬT CHẠY TỪ TRÁI QUA PHẢI -->
                    <h1 class="header-main-title">PLAT • DEX</h1>
                    <p class="header-sub-title">Nơi Các Siêu Nhân Ra Đời</p>
                </div>
            </div>
        </header>

        <!-- 3 NÚT UNLOCK (GIỮ NGUYÊN CẤU TRÚC VÀ LOGIC) -->
        <main class="unlock-container">
            <!-- Nút 1: Follow TikTok -->
            <button id="btn-step1" class="unlock-btn btn-tiktok" onclick="processStep(1, 'https://www.tiktok.com/@duy_lee01')">
                <svg viewBox="0 0 24 24">
                    <path d="M12.525 0h3.08c.089 1.488.75 2.83 1.8 3.82 1.05 1 2.45 1.57 3.965 1.62V8.58c-1.85 0-3.56-.56-4.985-1.52v7.1c0 4.14-3.36 7.5-7.5 7.5S1.39 18.3 1.39 14.16c0-4.14 3.36-7.5 7.5-7.5.38 0 .75.03 1.11.09V9.93c-.36-.08-.73-.12-1.11-.12-2.39 0-4.34 1.95-4.34 4.35 0 2.4 1.95 4.35 4.34 4.35 2.39 0 4.35-1.95 4.35-4.35V0z"/>
                </svg>
                <span id="txt-step1">Follow TikTok</span>
            </button>

            <!-- Nút 2: Đăng Kí Youtube -->
            <button id="btn-step2" class="unlock-btn btn-youtube disabled" onclick="processStep(2, 'https://youtube.com/@plat.dexios')">
                <svg viewBox="0 0 24 24">
                    <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                </svg>
                <span id="txt-step2">Đăng Kí Youtube</span>
            </button>

            <!-- Nút 3: Mở Khóa Để Tải -->
            <button id="btn-step3" class="unlock-btn btn-download disabled" onclick="downloadFile()">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14v-4H8l4-4 4 4h-3v4h-2z"/>
                </svg>
                <span id="txt-step3">Mở Khoá Để Tải</span>
            </button>
        </main>
    </div>

    <!-- FOOTER -->
    <footer>
        <div class="footer-info">
            <h3>THÔNG TIN CHỦ SỞ HỮU</h3>
            <p><strong>Developer:</strong> Plat • Dex</p>
            <p><strong>Địa Chỉ:</strong> Hà Nội, Việt Nam</p>
        </div>
    </footer>

    <!-- SCRIPT SUBUNLOCK (GIỮ NGUYÊN HOÀN TOÀN LOGIC TẢI) -->
    <script>
        let step1Completed = false;
        let step2Completed = false;

        function processStep(stepNum, url) {
            if (stepNum === 1 && !step1Completed) {
                window.open(url, '_blank');
                let count = 5;
                const txt = document.getElementById('txt-step1');
                txt.innerText = `Đang xác minh... (${count}s)`;

                const timer = setInterval(() => {
                    count--;
                    if (count > 0) {
                        txt.innerText = `Đang xác minh... (${count}s)`;
                    } else {
                        clearInterval(timer);
                        step1Completed = true;
                        txt.innerText = '✓ Đã Hoàn Thành';
                        
                        const btn1 = document.getElementById('btn-step1');
                        btn1.classList.add('completed');

                        // Mở khóa Nút 2
                        const btn2 = document.getElementById('btn-step2');
                        btn2.classList.remove('disabled');
                    }
                }, 1000);
            } 
            else if (stepNum === 2 && step1Completed && !step2Completed) {
                window.open(url, '_blank');
                let count = 5;
                const txt = document.getElementById('txt-step2');
                txt.innerText = `Đang xác minh... (${count}s)`;

                const timer = setInterval(() => {
                    count--;
                    if (count > 0) {
                        txt.innerText = `Đang xác minh... (${count}s)`;
                    } else {
                        clearInterval(timer);
                        step2Completed = true;
                        txt.innerText = '✓ Đã Hoàn Thành';

                        const btn2 = document.getElementById('btn-step2');
                        btn2.classList.add('completed');

                        // Mở khóa Nút Tải
                        const btn3 = document.getElementById('btn-step3');
                        btn3.classList.remove('disabled');
                    }
                }, 1000);
            }
        }

        function downloadFile() {
            if (step1Completed && step2Completed) {
                window.location.href = "https://link4m.org/fddLr2";
            }
        }
    </script>
</body>
</html>
