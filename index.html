<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubUnlock - Plat • Dex</title>
    <style>
        :root {
            --border-cyan: #00f0ff;
            --text-main: #ffffff;
        }

        /* Đồng bộ phông chữ Times New Roman */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Times New Roman', Times, serif !important;
        }

        body {
            background-color: #000000;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* CANVAS MATRIX BACKGROUND */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            opacity: 0.45;
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 30px 15px;
            flex: 1;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* HEADER & LIQUID GLASS */
        header {
            text-align: center;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .glass-box {
            position: relative;
            padding: 15px 30px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 8px 32px 0 rgba(0, 240, 255, 0.25),
                inset 0 0 15px rgba(255, 255, 255, 0.1);
            display: inline-block;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .glass-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0,240,255,0.3) 0%, rgba(255,0,85,0.3) 50%, transparent 70%);
            animation: liquidRotate 6s linear infinite;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes liquidRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .rainbow-3d-title {
            font-size: 2.3rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1.1;
            background: linear-gradient(
                90deg, 
                #ff0055, #ff7300, #fffb00, #48ff00, #00ffd5, #002bfd, #7a00ff, #ff00c8, #ff0055
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 2px 0px #000) drop-shadow(0px 0px 15px rgba(0, 240, 255, 0.8));
            animation: rainbowFlow 3s linear infinite;
        }

        @keyframes rainbowFlow {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        header p {
            font-size: 1.2rem;
            color: #00f0ff;
            text-transform: uppercase;
            font-weight: bold;
            margin-top: 5px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
        }

        /* KHUNG BỐ CỤC NÚT (Bé lại & Căn giữa) */
        .unlock-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
            width: 100%;
            max-width: 360px; /* Thu gọn vừa vặn giống mẫu */
            margin: 0 auto;
        }

        /* NÚT TỔNG QUÁT */
        .unlock-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 20px;
            font-size: 1.15rem;
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: none;
            color: #ffffff;
            border-radius: 12px; /* Bo góc mềm mại như hình mẫu */
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .unlock-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            flex-shrink: 0;
        }

        /* TRẠNG THÁI KHÓA (Ẩn nhẹ trong nền, KHÔNG BỊ TỐI ĐEN) */
        .unlock-btn.disabled {
            background: rgba(255, 255, 255, 0.05) !important;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: rgba(255, 255, 255, 0.35) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            cursor: not-allowed !important;
            box-shadow: none !important;
        }

        .unlock-btn.disabled svg {
            fill: rgba(255, 255, 255, 0.35) !important;
        }

        /* TRẠNG THÁI ĐÃ HOÀN THÀNH */
        .unlock-btn.completed {
            background: linear-gradient(135deg, #00b09b, #96c93d) !important;
            color: #ffffff !important;
            border-color: #00ff88 !important;
            box-shadow: 0 0 18px rgba(0, 255, 136, 0.5) !important;
        }

        /* Nút TikTok - Active */
        .btn-tiktok:not(.disabled):not(.completed) {
            background: linear-gradient(135deg, #ff0055 0%, #ff5252 50%, #ff7300 100%);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 20px rgba(255, 0, 85, 0.4);
        }
        .btn-tiktok:not(.disabled):hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 0, 85, 0.7);
        }

        /* Nút Telegram - Active */
        .btn-telegram:not(.disabled):not(.completed) {
            background: linear-gradient(135deg, #0088cc 0%, #00f0ff 100%);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 20px rgba(0, 240, 255, 0.4);
        }
        .btn-telegram:not(.disabled):hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 240, 255, 0.7);
        }

        /* Nút Mở Khoá Để Tải - Active (Giống màu UNLOCK ở mẫu) */
        .btn-download:not(.disabled) {
            background: linear-gradient(135deg, #e91e63 0%, #ff0055 100%);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 20px rgba(233, 30, 99, 0.6);
            animation: pulseUnlock 1.8s infinite alternate;
        }
        .btn-download:not(.disabled):hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 30px rgba(233, 30, 99, 0.9);
        }

        @keyframes pulseUnlock {
            0% { box-shadow: 0 0 10px rgba(233, 30, 99, 0.4); }
            100% { box-shadow: 0 0 25px rgba(233, 30, 99, 0.9); }
        }

        /* FOOTER */
        footer {
            width: 100%;
            background: transparent;
            border-top: 2px solid var(--border-cyan);
            padding: 30px 20px;
            margin-top: 40px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .footer-info {
            max-width: 650px;
            margin: 0 auto;
        }

        .footer-info h3 {
            color: var(--border-cyan);
            margin-bottom: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .footer-info p {
            margin-bottom: 6px;
            color: #ffffff;
            font-size: 1rem;
        }

        .map-container {
            margin-top: 15px;
            width: 100%;
            overflow: hidden;
            border: 1px solid var(--border-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
        }

        .map-container iframe {
            width: 100%;
            height: 200px;
            border: 0;
            filter: invert(90%) hue-rotate(180deg) contrast(1.2);
        }

        /* NÚT TELEGRAM FLOATING */
        .telegram-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #00f0ff, #0044ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
            z-index: 1000;
            border: 2px solid #ffffff;
        }

        .telegram-btn svg {
            width: 25px;
            height: 25px;
            fill: #ffffff;
        }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <div class="container">
        <header>
            <div class="glass-box">
                <h1 class="rainbow-3d-title">Plat • Dex</h1>
            </div>
            <p>Mở Khoá Để Tải</p>
        </header>

        <main class="unlock-container">
            
            <!-- Nút 1: Follow TikTok -->
            <button id="btn-step1" class="unlock-btn btn-tiktok" onclick="processStep(1, 'https://www.tiktok.com/@duy_lee01')">
                <svg viewBox="0 0 24 24">
                    <path d="M12.525 0h3.08c.089 1.488.75 2.83 1.8 3.82 1.05 1 2.45 1.57 3.965 1.62V8.58c-1.85 0-3.56-.56-4.985-1.52v7.1c0 4.14-3.36 7.5-7.5 7.5S1.39 18.3 1.39 14.16c0-4.14 3.36-7.5 7.5-7.5.38 0 .75.03 1.11.09V9.93c-.36-.08-.73-.12-1.11-.12-2.39 0-4.34 1.95-4.34 4.35 0 2.4 1.95 4.35 4.34 4.35 2.39 0 4.35-1.95 4.35-4.35V0z"/>
                </svg>
                <span id="txt-step1">Follow TikTok</span>
            </button>

            <!-- Nút 2: Channel Telegram (Ban đầu khóa - mờ ẩn vào nền) -->
            <button id="btn-step2" class="unlock-btn btn-telegram disabled" onclick="processStep(2, 'https://t.me/plat_shareios')">
                <svg viewBox="0 0 24 24">
                    <path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.56 8.16l-2.01 9.48c-.15.68-.55.84-1.12.52l-3.1-2.28-1.5 1.44c-.17.17-.31.31-.63.31l.22-3.17 5.77-5.21c.25-.22-.05-.34-.39-.12l-7.13 4.49-3.07-.96c-.67-.21-.68-.67.14-.99l12.01-4.63c.56-.21 1.05.13.83.92z"/>
                </svg>
                <span id="txt-step2">Channel Telegram</span>
            </button>

            <!-- Nút 3: Mở Khóa Để Tải (Khóa cho đến khi hoàn thành 1 & 2) -->
            <button id="btn-step3" class="unlock-btn btn-download disabled" onclick="downloadFile()">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14v-4H8l4-4 4 4h-3v4h-2z"/>
                </svg>
                <span id="txt-step3">Mở Khoá Để Tải</span>
            </button>

        </main>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-info">
            <h3>THÔNG TIN CHỦ SỞ HỮU</h3>
            <p><strong>Developer:</strong> Plat • Dex</p>
            <p><strong>Địa Chỉ:</strong> Hà Nội , Việt Nam</p>
            
            <div class="map-container">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d476859.1023737525!2d105.37248386807498!3d20.97344611400609!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3135ab9bd9861ca1%3A0x3233d6118b3cb358!2zSMOgIE7hu5lpLCBWaeG7h3QgTmFt!5e0!3m2!1svi!2s!4v1700000000000!5m2!1svi!2s" 
                    allowfullscreen="" 
                    loading="lazy">
                </iframe>
            </div>
        </div>
    </footer>

    <a href="https://t.me/plat_shareios" class="telegram-btn" target="_blank" aria-label="Telegram">
        <svg viewBox="0 0 24 24">
            <path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.56 8.16l-2.01 9.48c-.15.68-.55.84-1.12.52l-3.1-2.28-1.5 1.44c-.17.17-.31.31-.63.31l.22-3.17 5.77-5.21c.25-.22-.05-.34-.39-.12l-7.13 4.49-3.07-.96c-.67-.21-.68-.67.14-.99l12.01-4.63c.56-.21 1.05.13.83.92z"/>
        </svg>
    </a>

    <!-- SCRIPT CHẠY MATRIX VÀ SUBUNLOCK NỐI TIẾP -->
    <script>
        let step1Completed = false;
        let step2Completed = false;

        function processStep(stepNum, url) {
            if (stepNum === 1 && !step1Completed) {
                window.open(url, '_blank');
                let count = 5;
                const txt = document.getElementById('txt-step1');
                txt.innerText = `Đang xác minh... (${count}s)`;

                const timer = setInterval(() => {
                    count--;
                    if (count > 0) {
                        txt.innerText = `Đang xác minh... (${count}s)`;
                    } else {
                        clearInterval(timer);
                        step1Completed = true;
                        txt.innerText = '✓ Đã Hoàn Thành';
                        
                        const btn1 = document.getElementById('btn-step1');
                        btn1.classList.add('completed');

                        // Mở khóa Nút 2
                        const btn2 = document.getElementById('btn-step2');
                        btn2.classList.remove('disabled');
                    }
                }, 1000);
            } 
            else if (stepNum === 2 && step1Completed && !step2Completed) {
                window.open(url, '_blank');
                let count = 5;
                const txt = document.getElementById('txt-step2');
                txt.innerText = `Đang xác minh... (${count}s)`;

                const timer = setInterval(() => {
                    count--;
                    if (count > 0) {
                        txt.innerText = `Đang xác minh... (${count}s)`;
                    } else {
                        clearInterval(timer);
                        step2Completed = true;
                        txt.innerText = '✓ Đã Hoàn Thành';

                        const btn2 = document.getElementById('btn-step2');
                        btn2.classList.add('completed');

                        // Mở khóa Nút Tải
                        const btn3 = document.getElementById('btn-step3');
                        btn3.classList.remove('disabled');
                    }
                }, 1000);
            }
        }

        function downloadFile() {
            if (step1Completed && step2Completed) {
                window.location.href = "YOUR_FINAL_DOWNLOAD_LINK_HERE";
            }
        }

        // MATRIX BACKGROUND
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ<>/{}[];:*&^%$#@!PLATDEX';
        const fontSize = 16;
        const totalStreams = 45;
        const streams = [];

        for (let i = 0; i < totalStreams; i++) {
            resetStream(i);
        }

        function resetStream(i) {
            const dir = Math.floor(Math.random() * 3);
            let x, y;

            if (dir === 0) {
                x = Math.random() * canvas.width;
                y = Math.random() * -200;
            } else if (dir === 1) {
                x = Math.random() * -200;
                y = Math.random() * canvas.height;
            } else {
                x = canvas.width + Math.random() * 200;
                y = Math.random() * canvas.height;
            }

            streams[i] = {
                dir: dir,
                x: x,
                y: y,
                speed: 0.8 + Math.random() * 1.2,
                length: 6 + Math.floor(Math.random() * 10),
                spacing: 22,
                chars: Array.from({length: 16}, () => chars.charAt(Math.floor(Math.random() * chars.length)))
            };
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + 'px monospace';

            streams.forEach((s, idx) => {
                for (let j = 0; j < s.length; j++) {
                    let charX = s.x;
                    let charY = s.y;

                    if (s.dir === 0) charY -= j * s.spacing;
                    else if (s.dir === 1) charX -= j * s.spacing;
                    else if (s.dir === 2) charX += j * s.spacing;

                    if (j === 0) {
                        ctx.fillStyle = '#ffffff';
                    } else {
                        ctx.fillStyle = `rgba(0, 240, 255, ${1 - j / s.length})`;
                    }

                    if (Math.random() < 0.02) {
                        s.chars[j] = chars.charAt(Math.floor(Math.random() * chars.length));
                    }

                    ctx.fillText(s.chars[j], charX, charY);
                }

                if (s.dir === 0) s.y += s.speed;
                else if (s.dir === 1) s.x += s.speed;
                else if (s.dir === 2) s.x -= s.speed;

                if (
                    (s.dir === 0 && s.y - s.length * s.spacing > canvas.height) ||
                    (s.dir === 1 && s.x - s.length * s.spacing > canvas.width) ||
                    (s.dir === 2 && s.x + s.length * s.spacing < 0)
                ) {
                    resetStream(idx);
                }
            });
        }

        setInterval(drawMatrix, 40);
    </script>
</body>
</html>
